name: Brackish
options:
  bundleIdPrefix: com.ohashenone
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Brackish:
    type: application
    platform: iOS
    sources:
      - Brackish
    info:
      path: Brackish/Info.plist
      properties:
        CFBundleDisplayName: Brackish
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSCameraUsageDescription: Photograph a catch to compare fish on this device and save it in your private journal.
        NSLocationWhenInUseUsageDescription: Sort the NYC fishing atlas by distance. Your precise location is never saved to a catch.
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ohashenone.brackish
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BrackishTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BrackishTests
      - path: Evidence/model-evaluation
        type: folder
        buildPhase: resources
    dependencies:
      - target: Brackish
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  BrackishUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BrackishUITests]
    dependencies:
      - target: Brackish
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Brackish:
    build:
      targets:
        Brackish: all
    test:
      targets: [BrackishTests, BrackishUITests]
